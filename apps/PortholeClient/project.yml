name: PortholeClient
options:
  bundleIdPrefix: dev.finklea
  deploymentTarget:
    iOS: "26.0"
packages:
  Porthole:
    path: ../..
targets:
  PortholeClient:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Sources
    dependencies:
      - package: Porthole
        product: PortholeTransport
      - package: Porthole
        product: PortholeMedia
      - package: Porthole
        product: PortholeProtocol
    info:
      path: Porthole-Info.plist
      properties:
        NSLocalNetworkUsageDescription: "Porthole connects to your Mac on your local network to mirror its screen."
        NSCameraUsageDescription: "Porthole uses the camera to scan the pairing QR code shown on your Mac."
        NSBonjourServices:
          - _porthole._tcp
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.finklea.porthole
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K7CBQW6MPG
schemes:
  PortholeClient:
    build:
      targets:
        PortholeClient: all
    run:
      config: Debug
