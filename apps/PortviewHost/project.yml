name: PortviewHost
options:
  deploymentTarget:
    macOS: "26.0"
# Signing team + bundle-id prefix come from ../Portview.xcconfig (shared with
# the iOS client). Per-developer override: ../Portview.local.xcconfig — see
# apps/README.md "Building with your own team".
configFiles:
  Debug: ../Portview.xcconfig
  Release: ../Portview.xcconfig
packages:
  Portview:
    path: ../..
targets:
  PortviewHost:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources
      - path: AppIcon.icon
        type: file
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Portview
        product: PortviewHostCore
      # HostBeaconRecord (the shared CK record codec) for CloudKitBeaconStore.
      - package: Portview
        product: PortviewProtocol
    info:
      path: PortviewHost-Info.plist
      properties:
        CFBundleDisplayName: "Portview Host"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: "Portview publishes and accepts local-network connections from your iPhone to mirror and control this Mac."
        NSBonjourServices:
          - _portview._udp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PORTVIEW_BUNDLE_ID_PREFIX).portview.host
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(PORTVIEW_DEVELOPMENT_TEAM)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iCloud/CloudKit container entitlement for the re-wake beacon (CloudKitBeaconStore).
        # Gated on PORTVIEW_HOST_ENTITLEMENTS (default EMPTY in ../Portview.xcconfig): container
        # provisioning is account-gated — automatic signing can only mint a profile carrying the
        # iCloud capability with an Apple ID signed into Xcode — and the dev build must stay green
        # without one. Opt in via Portview.local.xcconfig once the account is set up; the app
        # fails soft (CloudKitBeaconStore checks the entitlement) when built without it.
        CODE_SIGN_ENTITLEMENTS: $(PORTVIEW_HOST_ENTITLEMENTS)
  # Host-app unit tests (Sol pass 4 F3). Every finding in review cycles 3-5 — including a security
  # regression — lived in this app layer, which had no test target at all.
  #
  # Deliberately a LOGIC-test bundle: it declares NO dependency on the PortviewHost app target, so
  # xcodegen sets no TEST_HOST and the app is never launched to run these. Hosting the bundle in the
  # app would boot `PortviewHostApp` (menu-bar extra, window, permission polling, the real keychain-
  # backed `PairingStore`) for every `make test-host`, which the test-live-side-effects rule forbids.
  # Instead the pure decision logic under test is compiled straight into the bundle by naming its
  # file below — the same reason that logic was factored out of `@MainActor HostAppModel` in the
  # first place. Adding a source file here is how a new pure type joins the suite.
  PortviewHostTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Tests
      - Sources/DeviceRowStatus.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PORTVIEW_BUNDLE_ID_PREFIX).portview.host.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PortviewHost:
    build:
      targets:
        PortviewHost: all
        PortviewHostTests: [test]
    test:
      targets:
        - PortviewHostTests
    run:
      config: Debug
