name: PortviewHost
options:
  bundleIdPrefix: dev.finklea
  deploymentTarget:
    macOS: "26.0"
packages:
  Portview:
    path: ../..
targets:
  PortviewHost:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources
      - path: AppIcon.icon
        type: file
    dependencies:
      - package: Portview
        product: PortviewHostCore
    info:
      path: PortviewHost-Info.plist
      properties:
        CFBundleDisplayName: "Portview Host"
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: "Portview publishes and accepts local-network connections from your iPhone to mirror and control this Mac."
        NSBonjourServices:
          - _portview._udp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.finklea.portview.host
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K7CBQW6MPG
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  PortviewHost:
    build:
      targets:
        PortviewHost: all
    run:
      config: Debug
