name: PortviewClient
options:
  bundleIdPrefix: dev.finklea
  deploymentTarget:
    iOS: "26.0"
packages:
  Portview:
    path: ../..
targets:
  PortviewClient:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Sources
      - path: AppIcon.icon
        type: file
    dependencies:
      - package: Portview
        product: PortviewTransport
      - package: Portview
        product: PortviewMedia
      - package: Portview
        product: PortviewProtocol
      - package: Portview
        product: PortviewClientCore
    info:
      path: Portview-Info.plist
      properties:
        NSLocalNetworkUsageDescription: "Portview connects to your Mac on your local network to mirror its screen."
        NSCameraUsageDescription: "Portview uses the camera to scan the pairing QR code shown on your Mac."
        NSBonjourServices:
          - _portview._udp
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.finklea.portview
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K7CBQW6MPG
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PortviewClientTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Tests
    dependencies:
      - target: PortviewClient
      - package: Portview
        product: PortviewTransport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.finklea.portview.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PortviewClient:
    build:
      targets:
        PortviewClient: all
        PortviewClientTests: [test]
    test:
      targets:
        - PortviewClientTests
    run:
      config: Debug
